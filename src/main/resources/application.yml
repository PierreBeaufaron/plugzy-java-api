spring:
  application:
    name: plugzy
  config:
    import: "classpath:env.properties"

  datasource:
    url: jdbc:postgresql://localhost:5432/plugzy_db
    username: plugzy
    password: plugzymdp

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true

  logging:
    level:
      org.flywaydb: DEBUG
      org.springframework.boot.autoconfigure.flyway: DEBUG

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true